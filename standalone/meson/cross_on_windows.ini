[constants]
toolchain = '@GLOBAL_SOURCE_ROOT@' / 'compilers' / 'GC' / '3.0a5.2'

[binaries]
c      = toolchain / 'mwcceppc.exe'
c_ld   = toolchain / 'mwldeppc.exe'
cpp    = toolchain / 'mwcceppc.exe'
cpp_ld = toolchain / 'mwldeppc.exe'
nasm   = toolchain / 'mwasmeppc.exe'
ar     = toolchain / 'mwldeppc.exe'
strip   = 'false'

[host_machine]
system      = 'bare metal'
cpu_family  = 'ppc'
cpu         = 'ppc'
endian      = 'big'
