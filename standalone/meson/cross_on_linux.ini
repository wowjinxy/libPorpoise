[constants]
toolchain = '@GLOBAL_SOURCE_ROOT@' / 'compilers' / 'GC' / '3.0a5.2'
wibo = '@GLOBAL_SOURCE_ROOT@' / 'compilers' / 'wibo'

[binaries]
c      = [wibo, toolchain / 'mwcceppc.exe']
c_ld   = [wibo, toolchain / 'mwldeppc.exe']
cpp    = [wibo, toolchain / 'mwcceppc.exe']
cpp_ld = [wibo, toolchain / 'mwldeppc.exe']
nasm   = [wibo, toolchain / 'mwasmeppc.exe']
ar     = [wibo, toolchain / 'mwldeppc.exe']
strip   = 'false'

[host_machine]
system      = 'bare metal'
cpu_family  = 'ppc'
cpu         = 'ppc'
endian      = 'big'
